name: Publish (trusted, additive)

# Consolidated publish workflow for npm trusted publishing.
# Trusted publishing accepts one workflow file per package as the OIDC
# trust anchor, so all publish scenarios route through here via `mode`.
# Manual-only for now; the 9 legacy publish workflows still handle tag
# pushes and the nightly cron via NPM_LUI_AUTH_TOKEN until each package
# is migrated on npmjs.com.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: What to publish
        type: choice
        required: true
        default: stable
        options:
          - stable
          - nightly
          - rc
          - container
          - headless
          - client-support-angular
          - client-support-ui5
          - auth-oidc-pkce
          - cra
      nightly_version:
        description: 'For rc mode only, e.g. 2.0.0-rc1'
        type: string
        required: false

permissions:
  contents: read

jobs:
  prepare:
    uses: ./.github/workflows/prepare.yml
    secrets: inherit
    permissions:
      actions: write
      contents: read
    with:
      buildcache_key: buildcache-trusted-${{ github.ref }}

  publish:
    runs-on: ubuntu-latest
    needs: prepare
    if: github.repository == 'luigi-project/luigi'
    permissions:
      contents: read
      id-token: write
    env:
      NIGHTLY_VERSION: ${{ inputs.nightly_version }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'
      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: |
            ~/tmp_build
            ~/cypress-binary-cache
          key: buildcache-trusted-${{ github.ref }}
      - run: cp -r ~/tmp_build/* .
      - name: Publish
        run: |
          case "${{ inputs.mode }}" in
            stable)                  bash ./scripts/npmPublish.sh ;;
            container)               bash ./scripts/npmPublish.sh luigi-container-release ;;
            headless)                bash ./scripts/npmPublish.sh luigi-headless-release ;;
            client-support-angular)  bash ./scripts/npmPublish.sh luigi-client-support-angular-release ;;
            client-support-ui5)      bash ./scripts/npmPublish.sh luigi-client-support-ui5-release ;;
            auth-oidc-pkce)          bash ./scripts/npmPublish.sh auth-oidc-pkce-plugin-release ;;
            cra)                     bash ./scripts/npmPublish.sh cra-release ;;
            nightly)                 cd scripts && npm ci && NIGHTLY=true npm run release && npm run publish:nightly ;;
            rc)                      cd scripts && npm ci && npm run release && npm run publish:nightly ;;
          esac
