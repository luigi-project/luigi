[[IgnoredVulns]]
id = "GHSA-g3hv-75wg-m249"
reason = "Reviewed the locked minimatch versions and their usage in development tooling. Legacy minimatch 3.x lacks the vulnerable preprocessing implementation. The minimatch 9.x/10.x consumers in TypeScript-ESLint pass { dot: true }, retaining the default optimizationLevel of 1; this advisory requires optimizationLevel >= 2. No allowDefaultProject configuration is enabled, and TypeScript-ESLint rejects ** in those patterns. No applicable exploit path was identified in the current dependency chain and configuration. Reassess if either changes."

[[IgnoredVulns]]
id = "GHSA-gv7w-rqvm-qjhr"
reason = "esbuild is a transitive build-time dependency only (nested under Vite); not shipped in the published @luigi-project/client-support-angular package. CVE requires Deno + malicious NPM_CONFIG_REGISTRY, neither of which apply to our Node-based build. Will revisit when @angular/build moves to Vite 8."

[[IgnoredVulns]]
id = "GHSA-mh99-v99m-4gvg"
reason = "brace-expansion is a dev-only transitive dep (via eslint, glob, test-exclude) used to expand glob patterns supplied by our own configs, not untrusted input. The 1.x and 2.x branches have no backport yet as of this writing; the published @luigi-project/client-support-angular package does not ship brace-expansion at runtime. Revisit when 1.1.17 / 2.1.3 are published."
