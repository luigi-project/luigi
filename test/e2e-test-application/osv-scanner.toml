[[IgnoredVulns]]
id = "GHSA-g3hv-75wg-m249"
reason = "Reviewed the locked minimatch versions and their usage in development tooling. Legacy minimatch 3.x lacks the vulnerable preprocessing implementation. The minimatch 9.x/10.x consumers in TypeScript-ESLint pass { dot: true }, retaining the default optimizationLevel of 1; this advisory requires optimizationLevel >= 2. No allowDefaultProject configuration is enabled, and TypeScript-ESLint rejects ** in those patterns. No applicable exploit path was identified in the current dependency chain and configuration. Reassess if either changes."

[[IgnoredVulns]]
id = "GHSA-mh99-v99m-4gvg"
reason = "brace-expansion is a dev-only transitive dep (via eslint) in this E2E test harness — never published — used to expand glob patterns supplied by our own configs, not untrusted input. The 1.x and 2.x branches have no backport yet as of this writing. Revisit when 1.1.17 / 2.1.3 are published."

[[IgnoredVulns]]
id = "GHSA-vfj7-8cjw-p6xm"
reason = "braces is a dev-only transitive dep (via micromatch, under http-proxy-middleware, fast-glob) in this E2E test harness — never published — used to expand glob patterns supplied by our own configs, not untrusted input. The vulnerability is a stack-exhaustion DoS requiring attacker-controlled deeply-nested brace patterns, which never reach these code paths. braces 3.0.3 is the latest published version with no fix available yet. Revisit when a patched braces (>3.0.3) is released."
