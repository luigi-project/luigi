[[IgnoredVulns]]
id = "GHSA-vfj7-8cjw-p6xm"
reason = "braces is a dev-only transitive dep (via micromatch, under http-proxy-middleware, fast-glob) in this E2E test harness — never published — used to expand glob patterns supplied by our own configs, not untrusted input. The vulnerability is a stack-exhaustion DoS requiring attacker-controlled deeply-nested brace patterns, which never reach these code paths. braces 3.0.3 is the latest published version with no fix available yet. Revisit when a patched braces (>3.0.3) is released."
